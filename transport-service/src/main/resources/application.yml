spring:
  application:
    name: transport-service
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: transport
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: transport
    schemas:
      - transport
    create-schemas: true
    validate-migration-naming: true

server:
  port: ${TRANSPORT_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

hotel-service:
  base-url: ${HOTEL_SERVICE_BASE_URL:http://localhost:8080}
  connect-timeout: ${HOTEL_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${HOTEL_SERVICE_READ_TIMEOUT:3s}
