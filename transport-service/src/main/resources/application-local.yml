spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${TRANSPORT_DB_URL}
    username: ${TRANSPORT_DB_USERNAME}
    password: ${TRANSPORT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    show-sql: true
