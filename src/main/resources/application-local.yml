spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

app:
  cors:
    # Comma-separated origins can be supplied locally when needed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
